name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bats:
    # Both platforms on purpose. zsh ships with macOS and is installed on Linux,
    # and the versions differ enough to matter for a prompt plugin.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and bats
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh bats parallel

      - name: Install bats
        if: runner.os == 'macOS'
        run: brew install bats-core parallel

      - name: Silence the GNU parallel citation notice
        # Without this it writes to stderr on first run, and older versions block
        # waiting for the acknowledgement.
        run: |
          mkdir -p "$HOME/.parallel"
          touch "$HOME/.parallel/will-cite"

      - name: Install starship
        run: curl -sS https://starship.rs/install.sh | sh -s -- --yes

      - name: Verify the tools are present
        # The suite skips every starship test when the binary is missing, so a
        # failed install would otherwise report a green run with nothing tested.
        # Fail here instead.
        run: |
          zsh --version
          bats --version
          starship --version
          parallel --version | head -1

      - name: Run tests
        # Keep these flags in step with the justfile's test recipe.
        run: bats --print-output-on-failure --jobs 4 --no-parallelize-within-files tests/
